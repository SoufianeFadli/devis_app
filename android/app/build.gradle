plugins {
    id 'com.android.application'
}

android {
    namespace 'ma.sbbm.devis'
    compileSdk 36

    defaultConfig {
        applicationId 'ma.sbbm.devis'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.2'
}
